<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <radialGradient id="orb1" cx="0%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="100%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="100" cy="100" r="500" fill="url(#orb1)"/>
  <circle cx="1100" cy="530" r="500" fill="url(#orb2)"/>

  <!-- Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="24" fill="none" stroke="rgba(79,70,229,0.15)" stroke-width="2"/>

  <!-- Brand Badge -->
  <rect x="80" y="80" width="340" height="42" rx="21" fill="rgba(79,70,229,0.08)" stroke="rgba(79,70,229,0.2)" stroke-width="1.5"/>
  <circle cx="104" cy="101" r="5" fill="#0369A1"/>
  <text x="120" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#4338CA">Founder &amp; CEO @ icode Studios</text>

  <!-- Name Heading -->
  <text x="80" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#0F172A" letter-spacing="-1">Umair Amjad Khan</text>
  <text x="80" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" fill="url(#brand)">AI &amp; Machine Learning Engineer</text>

  <!-- Description Tagline -->
  <text x="80" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="500" fill="#475569">Building Production AI Systems, LLM Pipelines, RAG Architectures &amp; Computer Vision</text>

  <!-- Tech Tags -->
  <g transform="translate(80, 410)">
    <rect x="0" y="0" width="120" height="38" rx="10" fill="rgba(3,105,161,0.08)" stroke="rgba(3,105,161,0.2)" stroke-width="1"/>
    <text x="60" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0369A1" text-anchor="middle">LLMs &amp; RAG</text>

    <rect x="136" y="0" width="150" height="38" rx="10" fill="rgba(79,70,229,0.08)" stroke="rgba(79,70,229,0.2)" stroke-width="1"/>
    <text x="211" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#4F46E5" text-anchor="middle">Computer Vision</text>

    <rect x="302" y="0" width="100" height="38" rx="10" fill="rgba(124,58,237,0.08)" stroke="rgba(124,58,237,0.2)" stroke-width="1"/>
    <text x="352" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#7C3AED" text-anchor="middle">MLOps</text>

    <rect x="418" y="0" width="110" height="38" rx="10" fill="rgba(4,120,87,0.08)" stroke="rgba(4,120,87,0.2)" stroke-width="1"/>
    <text x="473" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#047857" text-anchor="middle">PyTorch</text>
  </g>

  <!-- Website URL Footer -->
  <text x="80" y="535" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#0369A1">https://umairamjadkhan.dev</text>
